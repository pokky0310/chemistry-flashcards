;color:#a8c1dc;margin-bottom:15px}.answer{font-size:clamp(27px,5vw,44px);font-weight:800;color:#8debd6;margin-top:18px;word-break:break-word}.actions{margin-top:15px}.actions button{flex:1;min-width:120px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice-grid button{min-height:75px;font-size:clamp(17px,3vw,23px);overflow-wrap:anywhere}.correct{border-color:#4ade80!important;background:#17634c!important}.wrong{border-color:#fb7185!important;background:#742e42!important}.feedback{min-height:45px;margin:15px 0 0;font-weight:700}.entry{display:flex;gap:9px;flex-wrap:wrap}.entry input{flex:1;min-width:160px;font-size:22px}.entry button{min-width:120px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:9px}.list-item{padding:11px;background:#1e304d;border-radius:12px}.list-item strong{color:#a7f3d0}.hidden{display:none!important}footer{font-size:13px;color:#a6b8d0;margin-top:20px}label{font-size:13px;color:#b8c8e0;display:block;margin-bottom:5px}.setting{min-width:180px;flex:1}.setting select{width:100%}@media(max-width:480px){.choice-grid{grid-template-columns:1fr}.panel{padding:15px}.card{min-height:240px}}
</style></head><body><main><div class="top"><div><h1>🧪 化学式マスター</h1><p class="sub">暗記カード・4択・入力テスト・苦手克服</p></div><div class="chip" id="totalBadge">収録中</div></div>
<div class="panel"><div class="tabs"><button data-tab="flash" class="active">📚 単語カード</button><button data-tab="quiz">🎯 4択クイズ</button><button data-tab="type">⌨️ 入力テスト</button><button data-tab="list">📖 一覧</button></div><div class="settings" style="margin-top:17px"><div class="setting"><label for="category">分野</label><select id="category"></select></div><div class="setting"><label for="scope">出題対象</label><select id="scope"><option value="all">すべて</option><option value="missed">苦手・間違えた問題</option><option value="new">未学習</option><option value="known">覚えた問題</option></select></div><div class="setting"><label for="direction">出題方向</label><select id="direction"><option value="name">物質名 → 化学式</option><option value="formula">化学式 → 物質名</option></select></div></div><div class="actions"><button id="shuffle">🔀 シャッフル</button><button id="resetFilter">条件をリセット</button></div></div>

<div class="panel"><h3>💾 学習データ</h3><p class="muted small">このブラウザー内に自動保存。別のパソコンへの移行には書き出し・読み込みを利用してください。</p><div class="actions"><button id="export">学習記録を保存（JSON）</button><button id="importBtn">学習記録を読み込む</button><button id="resetStats" class="bad">学習記録をリセット</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></div><footer>ネット接続不要・外部ライブラリ不要。データはこの端末のブラウザーに保存されます。共有端末やブラウザーのデータ消去にご注意ください。</footer></main>
<script>
const RAW_CARDS=[["水", "H2O"], ["アンモニア", "NH3"], ["一酸化炭素", "CO"], ["二酸化炭素", "CO2"], ["一酸化窒素", "NO"], ["二酸化窒素", "NO2"], ["二酸化硫黄", "SO2"], ["三酸化硫黄", "SO3"], ["過酸化水素", "H2O2"], ["フッ化水素", "HF"], ["塩化水素", "HCl"], ["臭化水素", "HBr"], ["ヨウ化水素", "HI"], ["二酸化ケイ素", "SiO2"], ["二酸化マンガン", "MnO2"], ["二酸化鉛", "PbO2"], ["二酸化スズ", "SnO2"], ["硫化水素", "H2S"], ["硫酸", "H2SO4"], ["亜硫酸", "H2SO3"], ["硫酸銅（Ⅱ）", "CuSO4"], ["硫酸鉄（Ⅱ）", "FeSO4"], ["硫酸ナトリウム", "Na2SO4"], ["硫酸水素ナトリウム", "NaHSO4"], ["硫酸カリウム", "K2SO4"], ["硫酸カルシウム", "CaSO4"], ["硝酸", "HNO3"], ["亜硝酸", "HNO2"], ["硝酸銀", "AgNO3"], ["硝酸銅（Ⅱ）", "Cu(NO3)2"], ["硝酸ナトリウム", "NaNO3"], ["硝酸カリウム", "KNO3"], ["硝酸カルシウム", "Ca(NO3)2"], ["炭酸", "H2CO3"], ["炭酸ナトリウム", "Na2CO3"], ["炭酸水素ナトリウム", "NaHCO3"], ["炭酸マグネシウム", "MgCO3"], ["炭酸カルシウム", "CaCO3"], ["炭酸バリウム", "BaCO3"], ["炭酸アンモニウム", "(NH4)2CO3"], ["シュウ酸", "H2C2O4"], ["酢酸", "CH3COOH"], ["リン酸", "H3PO4"], ["リン酸ナトリウム", "Na3PO4"], ["リン酸アルミニウム", "AlPO4"], ["十酸化四リン", "P4O10"], ["次亜塩素酸", "HClO"], ["亜塩素酸", "HClO2"], ["塩素酸", "HClO3"], ["過塩素酸", "HClO4"], ["酸化ナトリウム", "Na2O"], ["酸化カルシウム", "CaO"], ["酸化マグネシウム", "MgO"], ["酸化アルミニウム", "Al2O3"], ["酸化鉄（Ⅲ）", "Fe2O3"], ["酸化マンガン（Ⅳ）", "MnO2"], ["酸化銅（Ⅰ）", "Cu2O"], ["酸化銅（Ⅱ）", "CuO"], ["酸化亜鉛", "ZnO"], ["フッ化ナトリウム", "NaF"], ["フッ化カルシウム", "CaF2"], ["フッ化アルミニウム", "AlF3"], ["フッ化銀", "AgF"], ["塩化ナトリウム", "NaCl"], ["塩化カルシウム", "CaCl2"], ["塩化アンモニウム", "NH4Cl"], ["塩化カリウム", "KCl"], ["塩化マグネシウム", "MgCl2"], ["塩化バリウム", "BaCl2"], ["塩化アルミニウム", "AlCl3"], ["塩化銀", "AgCl"], ["塩化亜鉛", "ZnCl2"], ["塩化銅（Ⅱ）", "CuCl2"], ["臭化リチウム", "LiBr"], ["ヨウ化カリウム", "KI"], ["硫化銅（Ⅱ）", "CuS"], ["硫化鉄（Ⅱ）", "FeS"], ["硫化ナトリウム", "Na2S"], ["硫化亜鉛", "ZnS"], ["硫化カルシウム", "CaS"], ["水酸化ナトリウム", "NaOH"], ["水酸化カリウム", "KOH"], ["水酸化カルシウム", "Ca(OH)2"], ["水酸化バリウム", "Ba(OH)2"], ["水酸化鉄（Ⅲ）", "Fe(OH)3"], ["水酸化アルミニウム", "Al(OH)3"], ["過マンガン酸カリウム", "KMnO4"], ["二クロム酸カリウム", "K2Cr2O7"], ["クロム酸カリウム", "K2CrO4"], ["酢酸ナトリウム", "CH3COONa"], ["メタン", "CH4"], ["エタン", "C2H6"], ["プロパン", "C3H8"], ["ブタン", "C4H10"], ["ペンタン", "C5H12"], ["ヘキサン", "C6H14"], ["ヘプタン", "C7H16"], ["オクタン", "C8H18"], ["ノナン", "C9H20"], ["デカン", "C10H22"], ["エチレン", "C2H4"], ["プロピレン", "C3H6"], ["アセチレン", "C2H2"], ["メタノール", "CH3OH"], ["エタノール", "C2H5OH"], ["ベンゼン", "C6H6"], ["グルコース", "C6H12O6"], ["ナフタレン", "C10H8"], ["フェノール", "C6H5OH"], ["ホルムアルデヒド", "HCHO"], ["アセトアルデヒド", "CH3CHO"], ["アセトン", "CH3COCH3"]];
const categories=["基本・気体","硫酸塩・硝酸塩","炭酸塩・リン酸塩","塩素の酸・酸化物","フッ化物・塩化物","硫化物・水酸化物","その他の無機化合物","有機化合物"];
const cards=RAW_CARDS.map(([name,formula],i)=>({id:i,name,formula,category:i<20?0:i<33?1:i<46?2:i<59?3:i<75?4:i<86?5:i<90?6:7}));
const KEY='chem_master_v2_progress';let scores={};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object')scores=saved;}catch(e){}

const RESUME_KEY='chem_master_v2_resume_v1';
const studyTabs=['flash','quiz','type','list'];
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(scores));}catch(e){}};
const cat=$('category'),scope=$('scope'),direction=$('direction');
cat.innerHTML='<option value="all">すべての分野</option>'+categories.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');
const defaultOrder=cards.map(c=>c.id);
const defaultSettings={category:'all',scope:'all',direction:'name'};
const isCardId=id=>Number.isInteger(id)&&id>=0&&id<cards.length;
function uniqueIds(values){return Array.isArray(values)?[...new Set(values.filter(isCardId))]:[];}
function eligible(c,settings){
 const result=scores[c.id];
 return (settings.category==='all'||String(c.category)===settings.category)&&
  (settings.scope==='all'||(settings.scope==='new'?!result:result===settings.scope));
}
function makeSession(settings=defaultSettings,order=defaultOrder,history=[]){
 return {settings:{...settings},order:[...order],deck:order.filter(id=>eligible(cards[id],settings)),
  index:0,questionId:null,completed:false,history,runStart:history.length,response:null,
  choices:[],revealed:false,draft:'',query:''};
}
function loadSession(raw){
 if(!raw||typeof raw!=='object'||!Array.isArray(raw.deck))return makeSession();
 const settings={
  category:categories.some((_,i)=>String(i)===raw.settings?.category)?raw.settings.category:'all',
  scope:['all','missed','known','new'].includes(raw.settings?.scope)?raw.settings.scope:'all',
  direction:raw.settings?.direction==='formula'?'formula':'name'
 };
 const savedOrder=uniqueIds(raw.order);
 const order=[...savedOrder,...defaultOrder.filter(id=>!savedOrder.includes(id))];
 const deck=uniqueIds(raw.deck),byId=deck.indexOf(raw.questionId);
 const index=byId>=0?byId:Math.max(0,Math.min(deck.length-1,Number.isInteger(raw.index)?raw.index:0));
 const history=Array.isArray(raw.history)?raw.history.filter(x=>x&&isCardId(x.id)&&typeof x.ok==='boolean'):[];
 const response=raw.response?.id===deck[index]&&typeof raw.response?.ok==='boolean'?raw.response:null;
 return {settings,order,deck,index,questionId:deck[index]??null,completed:deck.length>0&&raw.completed===true,
  history,runStart:Number.isInteger(raw.runStart)?Math.max(0,Math.min(raw.runStart,history.length)):0,response,
  choices:Array.isArray(raw.choices)?raw.choices.filter(x=>typeof x==='string').slice(0,4):[],
  revealed:raw.revealed===true,draft:typeof raw.draft==='string'?raw.draft:'',
  query:typeof raw.query==='string'?raw.query:''};
}
let savedResume;
try{savedResume=JSON.parse(localStorage.getItem(RESUME_KEY)||'null');}catch(e){}
const validResume=savedResume?.version===1;
const sessions=Object.fromEntries(studyTabs.map(t=>[t,loadSession(validResume?savedResume.modes?.[t]:null)]));
let tab=validResume&&studyTabs.includes(savedResume.tab)?savedResume.tab:'flash';
let offerResume=validResume&&studyTabs.some(t=>{const s=sessions[t];return s.index>0||s.completed||s.response||s.history.length||s.draft||s.revealed||s.query||s.order.some((id,i)=>id!==i)||Object.keys(defaultSettings).some(k=>s.settings[k]!==defaultSettings[k]);});
const active=()=>sessions[tab];
function saveResume(){
 for(const [mode,s] of Object.entries(sessions))s.questionId=mode==='list'?null:s.deck[s.index]??null;
 try{
  localStorage.setItem(RESUME_KEY,JSON.stringify({version:1,tab,modes:sessions}));
  $('resumeStorage').classList.add('hidden');
 }catch(e){$('resumeStorage').classList.remove('hidden');}
}
function prompt(c){return direction.value==='name'?c.name:c.formula;}
function solution(c){return direction.value==='name'?c.formula:c.name;}
function current(){const s=active();return s.completed?null:cards[s.deck[s.index]]||null;}
function record(c,ok,answer,kind='answer'){
 const entry={id:c.id,ok,answer,kind};
 scores[c.id]=ok?'known':'missed';persist();
 active().history.push(entry);active().response=entry;
}
function stats(){
 const s=active(),known=Object.values(scores).filter(x=>x==='known').length,missed=Object.values(scores).filter(x=>x==='missed').length;
 const answers=s.history.slice(s.runStart).filter(r=>r.kind!=='reveal');
 $('known').textContent=known;$('missed').textContent=missed;$('new').textContent=cards.length-known-missed;
 $('rate').textContent=answers.length?Math.round(answers.filter(r=>r.ok).length/answers.length*100)+'%':'—';
 $('progress').style.width=(known/cards.length*100)+'%';
 $('position').textContent=tab==='list'?'一覧 ・ '+s.deck.length+' 問':
  s.completed?'学習完了 ・ '+s.deck.length+' / '+s.deck.length:'対象 '+s.deck.length+' 問 ・ '+(s.deck.length?s.index+1:0)+' / '+s.deck.length;
 $('totalBadge').textContent='全 '+cards.length+' 項目';
}
function feedback(r,c){
 if(!r)return '';
 return r.kind==='reveal'?'答え：'+solution(c):r.ok?'正解！ 🎉':'不正解。正解：'+solution(c);
}
const noQuestion=()=>active().completed?'学習が完了しました':'該当する問題がありません';
function draw(){
 const s=active(),c=current();
 stats();
 $('continueStudy').classList.toggle('hidden',!offerResume);
 if(tab==='flash'){
  $('flashPrompt').textContent=c?prompt(c):noQuestion();
  $('flashAnswer').textContent=c?solution(c):'';
  $('flashAnswer').classList.toggle('hidden',!c||!s.revealed);
  $('flashHint').textContent=s.revealed?'答え':'問題・クリックで答えを表示';
  $('knowBtn').disabled=$('missBtn').disabled=$('next').disabled=!c;
  $('prev').disabled=!s.deck.length||(!s.completed&&s.index===0);
 }else if(tab==='quiz')drawQuiz();
 else if(tab==='type')drawType();
 else drawList();
}
function showTab(t){
 tab=t;
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
 for(const mode of studyTabs)$(mode+'Panel').classList.toggle('hidden',mode!==t);
 const s=active();
 cat.value=s.settings.category;scope.value=s.settings.scope;direction.value=s.settings.direction;
 if(t==='list')$('search').value=s.query;
 draw();
}
function saveAndDraw(){offerResume=false;draw();saveResume();}
function restart(settings=active().settings,order=active().order){
 sessions[tab]=makeSession(settings,order,active().history);
 if(tab==='list')$('search').value='';
 saveAndDraw();
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{offerResume=false;showTab(b.dataset.tab);saveResume();});
$('continueStudy').onclick=()=>saveAndDraw();
$('restartStudy').onclick=()=>restart();
function flip(){
 if(!current())return;
 active().revealed=!active().revealed;saveAndDraw();
}
$('flashCard').onclick=flip;
$('flashCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
function move(delta){
 const s=active();
 if(!s.deck.length||(!s.completed&&delta<0&&s.index===0)||(s.completed&&delta>0))return;
 if(s.completed)s.completed=false;
 else if(delta>0&&s.index===s.deck.length-1)s.completed=true;
 else s.index+=delta;
 s.revealed=false;s.response=null;s.choices=[];s.draft='';
 saveAndDraw();
}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function mark(ok){
 const c=current();if(!c)return;
 record(c,ok,null);move(1);
}
$('knowBtn').onclick=()=>mark(true);$('missBtn').onclick=()=>mark(false);
function shuffled(values){
 const copy=[...values];
 for(let i=copy.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];
 }
 return copy;
}
function drawQuiz(){
 const s=active(),c=current(),grid=$('choices');
 grid.innerHTML='';
 $('quizQuestion').textContent=c?'「'+prompt(c)+'」の答えは？':noQuestion();
 $('quizFeedback').textContent=c?feedback(s.response,c):'';
 $('quizNext').disabled=!c;
 if(!c)return;
 if(s.choices.length!==4||!s.choices.includes(solution(c))){
  const distractors=[...new Set(cards.map(solution))].filter(v=>v!==solution(c));
  s.choices=shuffled([solution(c),...shuffled(distractors).slice(0,3)]);
 }
 for(const v of s.choices){
  const button=document.createElement('button');
  button.textContent=v;
  if(s.response){
   button.disabled=true;
   if(v===solution(c))button.classList.add('correct');
   else if(v===s.response.answer)button.classList.add('wrong');
  }
  button.onclick=()=>{if(!s.response){record(c,v===solution(c),v);saveAndDraw();}};
  grid.appendChild(button);
 }
}
$('quizNext').onclick=()=>move(1);
function normalize(s){return s.trim().normalize('NFKC').replace(/\s+/g,'').replace(/[₀₁₂₃₄₅₆₇₈₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x));}
function drawType(){
 const s=active(),c=current(),input=$('typeInput');
 $('typeQuestion').textContent=c?'「'+prompt(c)+'」を入力してください':noQuestion();
 input.value=s.draft;input.disabled=!c;input.readOnly=Boolean(s.response);
 $('typeFeedback').textContent=c?feedback(s.response,c):'';
 $('typeCheck').disabled=$('typeReveal').disabled=!c||Boolean(s.response);
 $('typeNext').disabled=!c;
}
function checkType(revealOnly=false){
 const s=active(),c=current();
 if(!c||s.response)return;
 s.draft=$('typeInput').value;
 record(c,!revealOnly&&normalize(s.draft)===normalize(solution(c)),s.draft,revealOnly?'reveal':'answer');
 saveAndDraw();
}
$('typeCheck').onclick=()=>checkType();$('typeReveal').onclick=()=>checkType(true);
$('typeNext').onclick=()=>move(1);
$('typeInput').oninput=e=>{active().draft=e.target.value;saveResume();};
$('typeInput').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){if(active().response)move(1);else checkType();}};
function drawList(){
 const s=active(),term=s.query.toLowerCase().trim();
 const matches=s.deck.map(id=>cards[id]).filter(c=>c.name.toLowerCase().includes(term)||c.formula.toLowerCase().includes(term));
 $('listCount').textContent=matches.length+' 件';
 const box=$('listItems');box.innerHTML='';
 for(const c of matches){
  const row=document.createElement('div'),name=document.createElement('span'),formula=document.createElement('strong');
  row.className='list-item';name.textContent=c.name+'　';formula.textContent=c.formula;
  row.append(name,formula);box.appendChild(row);
 }
}
$('search').oninput=e=>{active().query=e.target.value;drawList();saveResume();};
for(const el of [cat,scope,direction])el.onchange=()=>restart({category:cat.value,scope:scope.value,direction:direction.value});
$('resetFilter').onclick=()=>{cat.value='all';scope.value='all';direction.value='name';restart(defaultSettings);};
$('shuffle').onclick=()=>restart(active().settings,shuffled(active().order));
$('resetStats').onclick=()=>{
 if(confirm('すべての学習記録を消去しますか？')){
  scores={};persist();
  for(const mode of studyTabs)sessions[mode]=makeSession(sessions[mode].settings,sessions[mode].order);
  showTab(tab);saveResume();
 }
};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,scores,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='chemistry-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.scores||typeof obj.scores!=='object')throw Error('形式が違います');const next={};for(const [k,v] of Object.entries(obj.scores)){if(/^\d+$/.test(k)&&+k<cards.length&&['known','missed'].includes(v))next[k]=v}if(confirm(`学習記録 ${Object.keys(next).length} 件を読み込み、現在の記録を置き換えますか？`)){scores=next;persist();if(tab==='list'){const s=active();s.deck=s.order.filter(id=>eligible(cards[id],s.settings));}draw();saveResume()}}catch(err){alert('読み込みに失敗しました：'+err.message)}e.target.value=''};
showTab(tab);
saveResume();
</script></body></html>
