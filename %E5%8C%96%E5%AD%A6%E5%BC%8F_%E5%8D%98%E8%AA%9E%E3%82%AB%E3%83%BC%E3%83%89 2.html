<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>化学式 単語カード</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7fafc;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center;padding:22px 14px}.app{width:min(100%,600px)}h1{font-size:1.6rem;margin:5px 0}p{color:#b8c6d7}.toolbar,.actions,.nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;border:1px solid #42536b;border-radius:12px;padding:12px 15px;background:#243349;color:#fff;cursor:pointer}button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid #80d9ff}button:hover{background:#344862}.primary{background:#087b9b;border-color:#087b9b}.good{background:#166534}.bad{background:#963e3e}.card{width:100%;min-height:290px;border-radius:24px;background:linear-gradient(145deg,#263955,#172438);border:1px solid #4a617b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;cursor:pointer;user-select:none;box-shadow:0 18px 45px #0005}.hint{font-size:.9rem;color:#9fc4d9}.word{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:750;overflow-wrap:anywhere}.formula{font-size:clamp(2rem,8vw,3.4rem);font-weight:750;letter-spacing:.03em}.counter{display:flex;justify-content:space-between;gap:10px;color:#d1e1ef}.bar{height:9px;background:#34465c;border-radius:12px;overflow:hidden;margin:9px 0 20px}.fill{height:100%;background:#4bc5ac;width:0%;transition:width .2s}.actions button{flex:1;min-width:110px}.nav button{flex:1}.small{font-size:.85rem;color:#a9bbcc}select{max-width:100%}</style></head><body><main class="app"><h1>🧪 化学式 単語カード</h1><p>物質名から化学式を覚えよう。カードをタップして答えを確認！</p><div class="toolbar"><select id="mode" aria-label="学習範囲"><option value="all">すべてのカード</option><option value="missed">間違えたカードだけ</option><option value="unseen">未回答のカードだけ</option></select><button id="shuffle">🔀 シャッフル</button><button id="reverse">🔁 表裏を逆にする</button></div><div class="counter"><span id="position"></span><span id="stats"></span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="card" class="card" role="button" tabindex="0" aria-label="タップして答えを表示"><div class="hint" id="side">問題</div><div class="word" id="content"></div><div class="hint" id="tap">タップで答えを見る</div></div><div class="actions"><button class="bad" id="miss">✕ まだ覚えてない</button><button class="good" id="know">✓ 覚えた</button></div><div class="nav"><button id="prev">← 前へ</button><button class="primary" id="next">次へ →</button></div><div class="toolbar"><button id="reset">学習記録をリセット</button></div><p class="small">学習記録はこのブラウザー内に保存されます。別の端末には自動同期されません。オフラインで使用できます。</p></main><script>
const CARDS=[["水", "H2O"], ["アンモニア", "NH3"], ["一酸化炭素", "CO"], ["二酸化炭素", "CO2"], ["一酸化窒素", "NO"], ["二酸化窒素", "NO2"], ["二酸化硫黄", "SO2"], ["三酸化硫黄", "SO3"], ["過酸化水素", "H2O2"], ["フッ化水素", "HF"], ["塩化水素", "HCl"], ["臭化水素", "HBr"], ["ヨウ化水素", "HI"], ["二酸化ケイ素", "SiO2"], ["二酸化マンガン", "MnO2"], ["二酸化鉛", "PbO2"], ["二酸化スズ", "SnO2"], ["硫化水素", "H2S"], ["硫酸", "H2SO4"], ["亜硫酸", "H2SO3"], ["硫酸銅（Ⅱ）", "CuSO4"], ["硫酸鉄（Ⅱ）", "FeSO4"], ["硫酸ナトリウム", "Na2SO4"], ["硫酸水素ナトリウム", "NaHSO4"], ["硫酸カリウム", "K2SO4"], ["硫酸カルシウム", "CaSO4"], ["硝酸", "HNO3"], ["亜硝酸", "HNO2"], ["硝酸銀", "AgNO3"], ["硝酸銅（Ⅱ）", "Cu(NO3)2"], ["硝酸ナトリウム", "NaNO3"], ["硝酸カリウム", "KNO3"], ["硝酸カルシウム", "Ca(NO3)2"], ["炭酸", "H2CO3"], ["炭酸ナトリウム", "Na2CO3"], ["炭酸水素ナトリウム", "NaHCO3"], ["炭酸マグネシウム", "MgCO3"], ["炭酸カルシウム", "CaCO3"], ["炭酸バリウム", "BaCO3"], ["炭酸アンモニウム", "(NH4)2CO3"], ["シュウ酸", "H2C2O4"], ["酢酸", "CH3COOH"], ["リン酸", "H3PO4"], ["リン酸ナトリウム", "Na3PO4"], ["リン酸アルミニウム", "AlPO4"], ["十酸化四リン", "P4O10"], ["次亜塩素酸", "HClO"], ["亜塩素酸", "HClO2"], ["塩素酸", "HClO3"], ["過塩素酸", "HClO4"], ["酸化ナトリウム", "Na2O"], ["酸化カルシウム", "CaO"], ["酸化マグネシウム", "MgO"], ["酸化アルミニウム", "Al2O3"], ["酸化鉄（Ⅲ）", "Fe2O3"], ["酸化マンガン（Ⅳ）", "MnO2"], ["酸化銅（Ⅰ）", "Cu2O"], ["酸化銅（Ⅱ）", "CuO"], ["酸化亜鉛", "ZnO"], ["フッ化ナトリウム", "NaF"], ["フッ化カルシウム", "CaF2"], ["フッ化アルミニウム", "AlF3"], ["フッ化銀", "AgF"], ["塩化ナトリウム", "NaCl"], ["塩化カルシウム", "CaCl2"], ["塩化アンモニウム", "NH4Cl"], ["塩化カリウム", "KCl"], ["塩化マグネシウム", "MgCl2"], ["塩化バリウム", "BaCl2"], ["塩化アルミニウム", "AlCl3"], ["塩化銀", "AgCl"], ["塩化亜鉛", "ZnCl2"], ["塩化銅（Ⅱ）", "CuCl2"], ["臭化リチウム", "LiBr"], ["ヨウ化カリウム", "KI"], ["硫化銅（Ⅱ）", "CuS"], ["硫化鉄（Ⅱ）", "FeS"], ["硫化ナトリウム", "Na2S"], ["硫化亜鉛", "ZnS"], ["硫化カルシウム", "CaS"], ["水酸化ナトリウム", "NaOH"], ["水酸化カリウム", "KOH"], ["水酸化カルシウム", "Ca(OH)2"], ["水酸化バリウム", "Ba(OH)2"], ["水酸化鉄（Ⅲ）", "Fe(OH)3"], ["水酸化アルミニウム", "Al(OH)3"], ["過マンガン酸カリウム", "KMnO4"], ["二クロム酸カリウム", "K2Cr2O7"], ["クロム酸カリウム", "K2CrO4"], ["酢酸ナトリウム", "CH3COONa"], ["メタン", "CH4"], ["エタン", "C2H6"], ["プロパン", "C3H8"], ["ブタン", "C4H10"], ["ペンタン", "C5H12"], ["ヘキサン", "C6H14"], ["ヘプタン", "C7H16"], ["オクタン", "C8H18"], ["ノナン", "C9H20"], ["デカン", "C10H22"], ["エチレン", "C2H4"], ["プロピレン", "C3H6"], ["アセチレン", "C2H2"], ["メタノール", "CH3OH"], ["エタノール", "C2H5OH"], ["ベンゼン", "C6H6"], ["グルコース", "C6H12O6"], ["ナフタレン", "C10H8"], ["フェノール", "C6H5OH"], ["ホルムアルデヒド", "HCHO"], ["アセトアルデヒド", "CH3CHO"], ["アセトン", "CH3COCH3"]];
const KEY='chem_flashcards_v1';let scores={};try{scores=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let order=CARDS.map((_,i)=>i),index=0,revealed=false,reversed=false;
const $=id=>document.getElementById(id);
function filtered(){const mode=$('mode').value;return order.filter(i=>mode==='all'||(mode==='missed'&&scores[i]===-1)||(mode==='unseen'&&scores[i]===undefined))}
function render(){const list=filtered();if(index>=list.length)index=Math.max(0,list.length-1);const i=list[index],exists=i!==undefined;const front=exists?CARDS[i][reversed?1:0]:'該当するカードはありません';const back=exists?CARDS[i][reversed?0:1]:'';$('content').textContent=revealed&&exists?back:front;$('content').className=(revealed&&!reversed||!revealed&&reversed)?'formula':'word';$('side').textContent=revealed?'答え':'問題';$('tap').textContent=exists?(revealed?'タップで問題に戻る':'タップで答えを見る'):'';$('position').textContent=exists?`${index+1} / ${list.length} 枚`:'0 枚';const known=Object.values(scores).filter(x=>x===1).length,missed=Object.values(scores).filter(x=>x===-1).length;$('stats').textContent=`覚えた ${known} ・ 復習 ${missed}`;$('fill').style.width=(Object.keys(scores).length/CARDS.length*100)+'%';$('know').disabled=$('miss').disabled=$('prev').disabled=$('next').disabled=!exists}
function move(delta){const l=filtered();if(!l.length)return;index=(index+delta+l.length)%l.length;revealed=false;render()}
function mark(score){const l=filtered(),i=l[index];if(i===undefined)return;scores[i]=score;try{localStorage.setItem(KEY,JSON.stringify(scores))}catch(e){}if($('mode').value==='all')move(1);else{revealed=false;render()}}
$('card').onclick=()=>{if(filtered().length){revealed=!revealed;render()}};$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('card').click()}};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('know').onclick=()=>mark(1);$('miss').onclick=()=>mark(-1);$('mode').onchange=()=>{index=0;revealed=false;render()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;revealed=false;render()};$('reverse').onclick=()=>{reversed=!reversed;revealed=false;render()};$('reset').onclick=()=>{if(confirm('学習記録をすべて消しますか？')){scores={};try{localStorage.removeItem(KEY)}catch(e){}index=0;revealed=false;render()}};render();
</script></body></html>
